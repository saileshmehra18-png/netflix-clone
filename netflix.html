<!DOCTYPE html>
<html>
    <head>
        <title>netflix clone</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="styles/video.css">
        <link rel="stylesheet" href="styles/general.css">
    </head>
    <body>
        <div class="first">
            <img class="first-video" src="thumbnails/main.webp">
            <img class="N" src="icons/netflix_PNG8.webp">
                
            <div class="main-video-informaton">

                <p>Series <span class="grey-dot">&#x2022</span> Romance <span class="grey-dot">&#x2022</span> 2026 <span class="grey-dot">&#x2022</span> 8 Episodes <span class="grey-dot">&#x2022</span> U/A 13+</p>

                <p class="video-info">
                    Years after an intense romance changed his life, a cafe`
                    owner(Vikrant Massey) finds a new path in the hills.
                </p>
                <p class="video-source">Based on Divya Prakash Dubey's novel. 
                </p>
                <div class="buttons">
                    <div class="first-pair">
                        <button class="play"><span class="play-icon">&#9658</span> Play</button>
                        <button class="info">More Info</button>
                    </div>
                    <div class="second-pair">
                        <button class="megaphone-button">
                        <i class="bi bi-megaphone-fill announce-icon"></i>
                        <p>it's official another season is coming</p>
                        </button>
                        <button class="status">
                            <span class="top-ten"><b>TOP</b><strong>10</strong></span>
                            <p>#3 in Shows</p>
                        </button>
                        
                    </div>
                    
                </div>
            </div>
        </div>

</html>
